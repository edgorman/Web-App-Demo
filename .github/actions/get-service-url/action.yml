name: 'Get Cloud Run Service URL'
description: 'Retrieves the URL of a Cloud Run service'

inputs:
  project_id:
    description: 'GCP Project ID'
    required: true
  region:
    description: 'GCP Region'
    required: true
  service_name:
    description: 'Cloud Run service name'
    required: true

outputs:
  url:
    description: 'The URL of the Cloud Run service'
    value: ${{ steps.get-url.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Get Cloud Run service URL
      id: get-url
      shell: bash
      run: |
        SERVICE="${{ inputs.service_name }}"
        REGION="${{ inputs.region }}"
        PROJECT="${{ inputs.project_id }}"
        
        # Check if service exists
        if ! gcloud run services describe "$SERVICE" \
          --region="$REGION" \
          --project="$PROJECT" \
          --format='value(metadata.name)' > /dev/null 2>&1; then
          echo "Warning: Cloud Run service '$SERVICE' not found in region '$REGION' for project '$PROJECT'"
          echo "Returning empty URL. This is expected for first-time deployments."
          echo "url=" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        SERVICE_URL=$(gcloud run services describe "$SERVICE" \
          --region="$REGION" \
          --project="$PROJECT" \
          --format='value(status.url)')
        
        if [ -z "$SERVICE_URL" ]; then
          echo "Warning: Failed to retrieve service URL for '$SERVICE'"
          echo "Returning empty URL."
          echo "url=" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "url=${SERVICE_URL}" >> $GITHUB_OUTPUT
        echo "Cloud Run service URL: ${SERVICE_URL}"
