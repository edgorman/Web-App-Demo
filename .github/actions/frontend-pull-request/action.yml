name: 'Frontend Pull Request'
description: 'Lints, tests, and builds the frontend service'

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      shell: bash
      working-directory: services/frontend
      run: |
        npm ci

    - name: Lint
      shell: bash
      working-directory: services/frontend
      run: |
        npm run lint

    - name: Build
      shell: bash
      working-directory: services/frontend
      run: |
        npm run build

    - name: Build Docker image
      shell: bash
      working-directory: services/frontend
      run: |
        docker build -t frontend:test .
