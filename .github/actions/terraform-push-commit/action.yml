name: 'Terraform Push Commit'
description: 'Performs terraform init and apply'

inputs:
  terraform_directory:
    description: 'The directory containing the Terraform files'
    required: true
  config_directory:
    description: 'The directory containing the configuration files (backend and vars)'
    required: true
  secrets:
    description: 'Newline-separated list of secrets or env vars to export (e.g., KEY=VALUE)'
    required: false
    default: ''

outputs:
  backend_service_url:
    description: 'The URL of the backend Cloud Run service'
    value: ${{ steps.terraform-output.outputs.backend_service_url }}
  frontend_service_url:
    description: 'The URL of the frontend Cloud Run service'
    value: ${{ steps.terraform-output.outputs.frontend_service_url }}

runs:
  using: "composite"
  steps:
    - name: Export Secrets
      shell: bash
      run: |
        if [ -n "${{ inputs.secrets }}" ]; then
          echo "${{ inputs.secrets }}" >> "$GITHUB_ENV"
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.13.5"
        terraform_wrapper: false

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform init \
          -backend-config="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfbackend"

    - name: Terraform Apply
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        terraform apply \
          -var-file="${{ github.workspace }}/${{ inputs.config_directory }}/terraform.tfvars" \
          -auto-approve

    - name: Get Terraform Outputs
      id: terraform-output
      shell: bash
      working-directory: ${{ inputs.terraform_directory }}
      run: |
        # Get terraform outputs (only for env infrastructure, not root)
        if terraform output backend_service_url > /dev/null 2>&1; then
          BACKEND_URL=$(terraform output -raw backend_service_url)
          FRONTEND_URL=$(terraform output -raw frontend_service_url)
          echo "backend_service_url=${BACKEND_URL}" >> $GITHUB_OUTPUT
          echo "frontend_service_url=${FRONTEND_URL}" >> $GITHUB_OUTPUT
          echo "Backend URL: ${BACKEND_URL}"
          echo "Frontend URL: ${FRONTEND_URL}"
        else
          echo "No service URLs output (root infrastructure)"
          echo "backend_service_url=" >> $GITHUB_OUTPUT
          echo "frontend_service_url=" >> $GITHUB_OUTPUT
        fi
