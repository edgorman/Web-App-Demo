name: 'Backend Push Commit'
description: 'Builds and deploys the backend service to Cloud Run'

inputs:
  project_id:
    description: 'GCP Project ID'
    required: true
  region:
    description: 'GCP Region'
    required: true
  service_name:
    description: 'Cloud Run service name'
    required: false
    default: 'backend'
  frontend_url:
    description: 'Frontend service URL for CORS configuration'
    required: false
    default: ''
  workload_identity_provider:
    description: 'The Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'The Google Service Account email'
    required: true

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/service-push-commit
      with:
        project_id: ${{ inputs.project_id }}
        region: ${{ inputs.region }}
        service_name: ${{ inputs.service_name }}
        service_directory: 'services/backend'
        repository_name: 'backend'
        docker_build_args: ${{ inputs.frontend_url != '' && format('FRONTEND_URL={0}', inputs.frontend_url) || '' }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
