name: 'Pull Request'

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.diff.outputs.infrastructure-root }}
      infrastructure-prod: ${{ steps.diff.outputs.infrastructure-prod }}
      infrastructure-dev: ${{ steps.diff.outputs.infrastructure-dev }}
      service-backend: ${{ steps.diff.outputs.service-backend }}
      service-frontend: ${{ steps.diff.outputs.service-frontend }}
    steps:
      - uses: actions/checkout@v5
      - id: diff
        uses: ./.github/actions/github-file-diff
        with: 
          branch_ref: ${{ github.base_ref }}

  infrastructure-warning:
    needs: diff
    if: |
      needs.diff.outputs.infrastructure-root == 'true' && (
        (github.base_ref == 'develop' && needs.diff.outputs.infrastructure-dev == 'true') ||
        (github.base_ref == 'main' && needs.diff.outputs.infrastructure-prod == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### ⚠️ Infrastructure Warning

            This pull request changes \`infrastructure/root\` at the same time as the \`infrastructure/env\` (dev/prod) resources it manages. Applying root and environment changes together in a single PR can cause issues, since environment resources may depend on root resources (e.g. state buckets, Workload Identity Federation, IAM) being applied first.

            Please split these into separate pull requests: one for \`infrastructure/root\`, and a follow-up for the environment changes.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  infrastructure-root:
    needs: diff
    if: needs.diff.outputs.infrastructure-root == 'true' && (github.base_ref == 'main' || github.base_ref == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: ${{ vars.ROOT_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  infrastructure-prod:
    needs: diff
    if: needs.diff.outputs.infrastructure-prod == 'true' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'web-app-demo-prod'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: ""
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          secrets: |
            ${{ steps.secrets.outputs.secrets }}
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  infrastructure-dev:
    needs: diff
    if: needs.diff.outputs.infrastructure-dev == 'true' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'web-app-demo-dev'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: ""
      - uses: ./.github/actions/terraform-pull-request
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/dev'
          secrets: |
            ${{ steps.secrets.outputs.secrets }}
            TF_VAR_google_client_id=${{ vars.GOOGLE_CLIENT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  backend:
    needs: diff
    if: needs.diff.outputs.service-backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/backend-pull-request

  frontend:
    needs: diff
    if: needs.diff.outputs.service-frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/frontend-pull-request
