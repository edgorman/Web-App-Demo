name: 'Push Commit'

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      infrastructure-root: ${{ steps.diff.outputs.infrastructure-root }}
      infrastructure-prod: ${{ steps.diff.outputs.infrastructure-prod }}
      infrastructure-dev: ${{ steps.diff.outputs.infrastructure-dev }}
      service-backend: ${{ steps.diff.outputs.service-backend }}
      service-frontend: ${{ steps.diff.outputs.service-frontend }}
    steps:
      - uses: actions/checkout@v5
      - id: diff
        uses: ./.github/actions/github-file-diff

  infrastructure-root:
    needs: diff
    if: needs.diff.outputs.infrastructure-root == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: ${{ vars.ROOT_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: |
            TF_VAR_github_provider_token=github_provider_token
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/root'
          config_directory: 'infrastructure/config/root'
          secrets: ${{ steps.secrets.outputs.secrets }}

  infrastructure-prod:
    needs: [diff, infrastructure-root]
    if: |
      always() &&
      needs.diff.result == 'success' &&
      needs.diff.outputs.infrastructure-prod == 'true' &&
      github.ref_name == 'main' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'web-app-demo-prod'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: ""
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/prod'
          secrets: ${{ steps.secrets.outputs.secrets }}

  infrastructure-dev:
    needs: [diff, infrastructure-root]
    if: |
      always() &&
      needs.diff.result == 'success' &&
      needs.diff.outputs.infrastructure-dev == 'true' &&
      github.ref_name == 'develop' &&
      (needs.infrastructure-root.result == 'success' || needs.infrastructure-root.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'web-app-demo-dev'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: ""
      - uses: ./.github/actions/terraform-push-commit
        with:
          terraform_directory: 'infrastructure/env'
          config_directory: 'infrastructure/config/dev'
          secrets: ${{ steps.secrets.outputs.secrets }}

  backend-prod:
    needs: [diff, infrastructure-prod]
    if: |
      always() &&
      needs.diff.result == 'success' &&
      needs.diff.outputs.service-backend == 'true' &&
      github.ref_name == 'main' &&
      (needs.infrastructure-prod.result == 'success' || needs.infrastructure-prod.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: frontend-url
        uses: ./.github/actions/get-service-url
        with:
          project_id: 'web-app-demo-prod'
          region: 'europe-west1'
          service_name: 'frontend'
      - uses: ./.github/actions/backend-push-commit
        with:
          project_id: 'web-app-demo-prod'
          region: 'europe-west1'
          frontend_url: ${{ steps.frontend-url.outputs.url }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  backend-dev:
    needs: [diff, infrastructure-dev]
    if: |
      always() &&
      needs.diff.result == 'success' &&
      needs.diff.outputs.service-backend == 'true' &&
      github.ref_name == 'develop' &&
      (needs.infrastructure-dev.result == 'success' || needs.infrastructure-dev.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: frontend-url
        uses: ./.github/actions/get-service-url
        with:
          project_id: 'web-app-demo-dev'
          region: 'europe-west1'
          service_name: 'frontend'
      - uses: ./.github/actions/backend-push-commit
        with:
          project_id: 'web-app-demo-dev'
          region: 'europe-west1'
          frontend_url: ${{ steps.frontend-url.outputs.url }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  frontend-prod:
    needs: [diff, infrastructure-prod, backend-prod]
    if: |
      always() &&
      needs.diff.result == 'success' &&
      needs.diff.outputs.service-frontend == 'true' &&
      github.ref_name == 'main' &&
      (needs.infrastructure-prod.result == 'success' || needs.infrastructure-prod.result == 'skipped') &&
      (needs.backend-prod.result == 'success' || needs.backend-prod.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'web-app-demo-prod'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: ""
      - id: backend-url
        uses: ./.github/actions/get-service-url
        with:
          project_id: 'web-app-demo-prod'
          region: 'europe-west1'
          service_name: 'backend'
      - uses: ./.github/actions/service-push-commit
        with:
          project_id: 'web-app-demo-prod'
          region: 'europe-west1'
          service_name: 'frontend'
          service_directory: 'services/frontend'
          repository_name: 'frontend'
          docker_build_args: 'VITE_BACKEND_URL=${{ steps.backend-url.outputs.url }}'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

  frontend-dev:
    needs: [diff, infrastructure-dev, backend-dev]
    if: |
      always() &&
      needs.diff.result == 'success' &&
      needs.diff.outputs.service-frontend == 'true' &&
      github.ref_name == 'develop' &&
      (needs.infrastructure-dev.result == 'success' || needs.infrastructure-dev.result == 'skipped') &&
      (needs.backend-dev.result == 'success' || needs.backend-dev.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - id: secrets
        uses: ./.github/actions/gcp-secret-manager
        with:
          project_id: 'web-app-demo-dev'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          secrets_list: ""
      - id: backend-url
        uses: ./.github/actions/get-service-url
        with:
          project_id: 'web-app-demo-dev'
          region: 'europe-west1'
          service_name: 'backend'
      - uses: ./.github/actions/service-push-commit
        with:
          project_id: 'web-app-demo-dev'
          region: 'europe-west1'
          service_name: 'frontend'
          service_directory: 'services/frontend'
          repository_name: 'frontend'
          docker_build_args: 'VITE_BACKEND_URL=${{ steps.backend-url.outputs.url }}'
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
